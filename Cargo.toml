[workspace]
resolver = "2"
members = [
    "crates/editor-platform",
    "crates/editor-core",
    "crates/editor-render",
    "crates/editor-app",
    "crates/editor-cli",
    "crates/editor-macos",
]

[workspace.package]
version = "0.4.2"
edition = "2021"
license = "LicenseRef-Proprietary"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

[profile.dev]
# Fast incremental builds, snappy test execution
opt-level = 1

[profile.test]
opt-level = 2
